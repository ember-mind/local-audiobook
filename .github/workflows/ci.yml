name: Offline checks

on:
  push:
    branches: [main, 'review/**']
  pull_request:

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Shell syntax
        run: bash -n audiobook setup.sh
      - name: Python syntax
        run: python3 -m compileall -q scripts qwen tests
      - name: Feature map
        run: python3 tests/feature_map_check.py
      - name: Regression tests
        run: |
          python3 -m pip install requests
          python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Review source snapshot
        if: always() && github.ref == 'refs/heads/review/reliability-2026-09-17'
        run: git archive --format=tar.gz -o review-source.tar.gz HEAD
      - uses: actions/upload-artifact@v4
        if: always() && github.ref == 'refs/heads/review/reliability-2026-09-17'
        with:
          name: review-source
          path: review-source.tar.gz
          retention-days: 1
